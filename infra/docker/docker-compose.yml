services:
  postgres:
    image: postgres:16
    container_name: leadproject-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadproject}
      POSTGRES_DB: ${POSTGRES_DB:-leadproject}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadproject} -d ${POSTGRES_DB:-leadproject}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
